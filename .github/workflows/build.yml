name: Build and verify
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e './apps/api[dev]'
      - run: pytest apps/api/tests -q
        env:
          APP_ENV: development
          DATA_DIR: /tmp/net2net-test
          DATABASE_URL: sqlite:////tmp/net2net-test/test.db
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build native APK and run checks
        working-directory: ANDROID APP
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WISP-Radius-debug
          path: ANDROID APP/app/build/outputs/apk/debug/app-debug.apk
  docker:
    needs: [api, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build appliance
        run: docker build -t net2net-radius:test .
      - name: Verify FreeRADIUS configuration and API
        run: |
          docker run -d --name radius-test -e BOOTSTRAP_SUPERADMIN_PASSWORD=CI-only-password-2026! -e BOOTSTRAP_WISPADMIN_PASSWORD=CI-only-password-2026! net2net-radius:test
          for attempt in $(seq 1 30); do
            if docker exec radius-test python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"; then break; fi
            sleep 2
          done
          docker exec radius-test freeradius -XC
          docker exec radius-test python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/openapi.json')"
          docker logs radius-test
